<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#133631">
    <title>Маршрут 10:10</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="game">
      <canvas id="harbor" aria-hidden="true"></canvas>
      <header class="title">
        <p id="place"></p>
        <h1 id="title"></h1>
      </header>
      <div id="move-stick" role="img" hidden><span aria-hidden="true"></span></div>
      <button id="open-ticket" class="harbor-action" type="button" hidden></button>
      <button id="pick-up-ticket" class="harbor-action" type="button" hidden></button>
      <div class="controls">
        <p id="objective" role="status" hidden></p>
        <p id="status" role="status"></p>
      </div>
      <output id="stats" hidden></output>
    </main>
    <dialog id="ticket-dialog" aria-labelledby="ticket-title">
      <h2 id="ticket-title"></h2>
      <canvas id="ticket-symbol" role="img"></canvas>
      <p id="ticket-clue"></p>
      <form method="dialog">
        <button class="harbor-action" type="submit" autofocus></button>
      </form>
    </dialog>
    <p id="rotate-hint"></p>
  </body>
</html>
