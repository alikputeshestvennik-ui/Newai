name: Build Vibecoder APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'codex_android/**'
      - '.github/workflows/codex-apk.yml'
permissions:
  contents: read
concurrency:
  group: newai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fonts (Manrope, Unbounded)
        shell: bash
        run: |
          mkdir -p codex_android/app/src/main/assets/fonts
          curl -fsSL --connect-timeout 10 --max-time 20 --retry 1 -o codex_android/app/src/main/assets/fonts/manrope.ttf \
            "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf" || rm -f codex_android/app/src/main/assets/fonts/manrope.ttf
          curl -fsSL --connect-timeout 10 --max-time 20 --retry 1 -o codex_android/app/src/main/assets/fonts/unbounded.ttf \
            "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf" || rm -f codex_android/app/src/main/assets/fonts/unbounded.ttf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test local runtime
        run: python3 -m unittest discover -s codex_android/runtime -v
      - name: Compile and test Android app
        working-directory: codex_android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Prepare embedded runtime
        run: python3 codex_android/scripts/prepare_runtime_assets.py
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/newai.keystore"
          test -s "$RUNNER_TEMP/newai.keystore"
          test -n "$ANDROID_STORE_PASSWORD"
          keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$RUNNER_TEMP/newai.keystore" \
            -storepass:env ANDROID_STORE_PASSWORD > "$RUNNER_TEMP/newai-key-info.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          listing = Path(os.environ["RUNNER_TEMP"], "newai-key-info.txt").read_text()
          aliases = []
          alias = None
          for line in listing.splitlines():
              if line.startswith("Alias name: "):
                  alias = line.removeprefix("Alias name: ")
              elif line.strip() == "Entry type: PrivateKeyEntry" and alias is not None:
                  aliases.append(alias)
          if len(aliases) != 1:
              raise SystemExit("Expected exactly one private signing key in keystore")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ANDROID_KEY_ALIAS={aliases[0]}\n")
          PYTHON
      - name: Build signed APK
        working-directory: codex_android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/newai.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
          ANYMODEL_KEY: ${{ secrets.ANYMODEL_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose codex_android/app/build/outputs/apk/release/app-release.apk
          cp codex_android/app/build/outputs/apk/release/app-release.apk Vibecoder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vibecoder-signed-apk
          path: Vibecoder.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/newai.keystore" "$RUNNER_TEMP/newai-key-info.txt"
