name: Городской маршрут · подписанный релиз
on:
  push:
    branches: [release/gorod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor 7 requires JDK 21; node_modules/@capacitor/android/capacitor/build.gradle sets JavaVersion.VERSION_21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - name: Install browser for mobile smoke checks
        run: npx playwright install --with-deps chromium
      - name: Check portrait, landscape, offline play and saves
        run: npx playwright test
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - run: npx cap sync android
      - name: Test, lint and build Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease
      - name: Verify APK has no permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" > apk-permissions.txt
          cat apk-permissions.txt
          if grep -q android.permission apk-permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-input
          retention-days: 1
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: dist/
  sign:
    if: github.repository == 'alikputeshestvennik-ui/Newai' && github.ref == 'refs/heads/release/gorod'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-build-input
      - name: Sign and verify production APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "${KEYSTORE_B64:?}" | base64 -d > "$key"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=Gorodskoy-Marshrut-release.apk
          "$tools/zipalign" -p -f 4 app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$key" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" aligned.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest debuggable "$apk")" = false
          test "$("$analyzer" manifest application-id "$apk")" = ru.alim.gorodskoy.city
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gorod-signed-release
          path: Gorodskoy-Marshrut-release.apk*
          if-no-files-found: error
