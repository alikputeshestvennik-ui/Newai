name: FrameVault APK
on:
  push:
    paths:
      - 'framevault/**'
      - '.github/workflows/framevault-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framevault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: framevault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install video test tools
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null; then
            video_tools="$RUNNER_TEMP/framevault-ffmpeg"
            printf '%s\n' 'imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282' | \
              python3 -m pip install --target "$video_tools" --only-binary=:all: --no-deps --require-hashes -r /dev/stdin
            ln -s "$video_tools"/imageio_ffmpeg/binaries/ffmpeg-linux-* "$video_tools/ffmpeg"
            "$video_tools/ffmpeg" -version
            echo "$video_tools" >> "$GITHUB_PATH"
          fi
      - name: Test and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameVault-reports
          path: |
            framevault/app/build/reports/tests/testDebugUnitTest/
            framevault/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: FrameVault-debug
          path: framevault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build and verify signed APK
        id: release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/framevault-android'
        env:
          FRAMEVAULT_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          FRAMEVAULT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FRAMEVAULT_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FRAMEVAULT_KEYSTORE_B64" || -z "$FRAMEVAULT_STORE_PASSWORD" || -z "$FRAMEVAULT_KEY_PASSWORD" ]]; then
            echo "Repository signing secrets are unavailable; the debug APK is available."
            exit 0
          fi
          umask 077
          export FRAMEVAULT_KEYSTORE="$RUNNER_TEMP/framevault.keystore"
          trap 'rm -f "$FRAMEVAULT_KEYSTORE"' EXIT
          printf '%s' "$FRAMEVAULT_KEYSTORE_B64" | base64 --decode > "$FRAMEVAULT_KEYSTORE"
          export FRAMEVAULT_KEY_ALIAS
          FRAMEVAULT_KEY_ALIAS="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$FRAMEVAULT_KEYSTORE" -storepass:env FRAMEVAULT_STORE_PASSWORD | \
            awk '/^Alias name: / { alias=substr($0,13) } /Entry type: PrivateKeyEntry/ { print alias }')"
          [[ -n "$FRAMEVAULT_KEY_ALIAS" && "$FRAMEVAULT_KEY_ALIAS" != *$'\n'* ]]
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk FrameVault.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.signed == 'true'
        with:
          name: FrameVault-signed
          path: framevault/FrameVault.apk
          if-no-files-found: error

  android-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android video playback and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: framevault
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameVault-android-tests
          path: framevault/app/build/reports/androidTests/connected/
