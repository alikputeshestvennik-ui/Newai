name: Build NewAI APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'codex_android/**'
      - '.github/workflows/codex-apk.yml'
permissions:
  contents: read
concurrency:
  group: newai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test local runtime
        run: python3 -m unittest discover -s codex_android/runtime -v
      - name: Compile and test Android app
        working-directory: codex_android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Prepare embedded runtime
        run: python3 codex_android/scripts/prepare_runtime_assets.py
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/newai.keystore"
          test -s "$RUNNER_TEMP/newai.keystore"
      - name: Build signed APK
        working-directory: codex_android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/newai.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose codex_android/app/build/outputs/apk/release/app-release.apk
          cp codex_android/app/build/outputs/apk/release/app-release.apk NewAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewAI-signed-apk
          path: NewAI.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/newai.keystore"
